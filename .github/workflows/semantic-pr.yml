name: semantic-pr-title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            perf
            test
          scopes: |
            api
            auth
            leads
            jobs
            customers
            proposals
            items
            kits
            service
            settings
            build
            db
            ci
            vercel

