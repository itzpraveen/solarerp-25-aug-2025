name: vercel-preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel env (Preview)
        run: vercel pull --yes --environment=preview --token ${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel local build)
        run: vercel build --token ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token ${{ secrets.VERCEL_TOKEN }} --yes)
          echo "preview_url=$url" >> $GITHUB_OUTPUT

      - name: Post Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL || '${{ steps.deploy.outputs.preview_url }}';
            core.summary.addHeading('Vercel Preview')
              .addLink(url, url)
              .write();
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}

